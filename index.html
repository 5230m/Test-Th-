<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello from GitHub Pages!</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    font-family: monospace;
    color: #e6edf3;
  }

  .card {
    text-align: center;
    padding: 48px 40px;
    border: 1px solid #30363d;
    border-radius: 12px;
    background: #161b22;
    max-width: 400px;
  }

  .emoji { font-size: 48px; margin-bottom: 16px; }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 10px;
    color: #58a6ff;
  }

  p {
    font-size: 14px;
    color: #8b949e;
    line-height: 1.8;
    margin-bottom: 20px;
  }

  .badge {
    display: inline-block;
    background: #1f6feb;
    color: #fff;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 20px;
  }

  .time {
    margin-top: 20px;
    font-size: 11px;
    color: #484f58;
  }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🚀</div>
  <h1>It works!</h1>
  <p>File HTML này đang chạy trên GitHub Pages.<br>Deploy thành công rồi!</p>
  <div class="badge">✓ GitHub Pages Live</div>
  <div class="time" id="t"></div>
</div>
<script>
  document.getElementById('t').textContent =
    'Loaded at: ' + new Date().toLocaleTimeString('vi-VN');
</script>
</body>
</html>
